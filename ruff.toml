# Ruff konfiqurasiyası.
#
# Niyə var: `scripts/night.sh`-dəki maşın qapısı `ruff check .` işlədir və
# commit qərarını ONA görə verir. Konfiqurasiya olmasa ruff öz standart geniş
# dəstini tətbiq edir (BLE001, FURB, PLR, UP, I...) — layihə kodu o dəstlə
# 94 xəta verir, yəni qapı heç bir tapşırığı buraxmaz və düzgün iş də
# `git reset --hard` ilə geri qaytarılar.
#
# Seçim: klassik flake8 dəsti (E + F). Bunlar real səhvləri tutur —
# istifadə olunmayan import, təyin olunmamış ad, sintaksis problemləri.

line-length = 100

[lint]
select = ["E", "F"]

# E501 (sətir uzunluğu) söndürülüb.
#
# DİQQƏT: bu bənd əvvəl «141 xətanın 130-u» yazırdı — o rəqəm ruff-un
# STANDART 88 limitinə aiddir. Yuxarıdakı `line-length = 100` ilə ölçüləndə
# cəmi 13 sətir uzundur: ai/matcher.py (4), ingestion/normalize.py (2),
# tests/test_matcher.py (2), ai/prompts.py, ingestion/ocr.py,
# tests/test_chains.py, tests/test_basket.py, tests/test_sanitize.py (1-1).
#
# Ən uzunu ai/prompts.py:31 — 140 simvol, JSON sxem sətri, bölünməsi
# mənasızdır. Yəni E501 real oxunaqlıq problemi gizlətmir; söndürülməsi
# 13 sətri qapıya salmamaq üçündür, formatlaşdırma qərarıdır.
ignore = ["E501"]

[lint.per-file-ignores]
# Testlərdə fixture-lar import olunub birbaşa çağırılmır - pytest onları
# ad ilə tapır, ruff isə "istifadə olunmayan import" sayır.
"tests/conftest.py" = ["F401"]
