# BasketIQ — production yığımı.
#
# İşə salmaq (LLM = Claude API):
#   cp .env.example .env      # sonra .env-i doldur: INGEST_API_KEY MÜTLƏQ dəyiş,
#                             # LLM_PROVIDER=claude + ANTHROPIC_API_KEY
#   docker compose up -d
#
# Ollama da lazımdırsa (LLM serverin öz CPU-sunda - ən azı 8 GB RAM):
#   docker compose --profile ollama up -d
#   docker compose exec ollama ollama pull qwen3:4b
#
# n8n də lazımdırsa (gündəlik avtomatik çəkiliş):
#   docker compose --profile n8n up -d
#
# Profillər birləşir: docker compose --profile ollama --profile n8n up -d

services:
  basketiq:
    build: .
    image: basketiq:latest
    restart: unless-stopped
    # Port dəyişəni ilə verilir: lokal maşında 8000 başqa xidmətdə ola bilər.
    ports:
      - "${BASKETIQ_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Bunlar .env-dəkindən ÜSTÜNDÜR - konteynerdə başqa cür ola bilməz.
      # Ollama artıq localhost-da deyil, qonşu servisdədir.
      # MEDIA_DIR /data-nın İÇİNDƏDİR: şəkillər bazanın yanında, eyni volume-da.
      APP_ENV: production
      OLLAMA_BASE_URL: http://ollama:11434
      DATA_DIR: /data
      MEDIA_DIR: /data/media
      # Chromium yolları Dockerfile-dakı ilə EYNİDİR, amma burada da yazılır:
      # .env-dəki boş `CHROME_BIN=` env_file ilə image-in ENV-ini ezərdi
      # (üstünlük: environment > env_file > image ENV) - brauzer tapılmazdı.
      CHROME_BIN: /usr/bin/chromium
      CHROMEDRIVER_PATH: /usr/bin/chromedriver
    volumes:
      # Yazılan hər şey burada: baza, xam kataloqlar, OCR mətni, LLM keşi,
      # şəkillər (media/).
      # Konteyner silinsə də data qalır.
      - basketiq_data:/data
    # `depends_on: ollama` YOXDUR: Ollama seçimlidir. Asılılıq qalsaydı, hər
    # `up` 9 GB-lıq image-i yenə endirib konteyneri qaldırardı. Ollama yoxdursa
    # tətbiq işləyir - Claude əsasdır, /health bunu "ok" sayır (app/main.py).

  # Ollama - SEÇİMLİ, yalnız `--profile ollama` ilə qalxır (2026-09-11).
  # LLM_PROVIDER=claude ilə o yalnız ehtiyatdır, amma image-i ~9 GB-dır
  # (ölçüldü, `docker images`) və qwen3:4b işləyəndə ~4 GB RAM tutur -
  # 2 GB-lıq droplet-ə sığmır.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    # Port QƏSDƏN dərc olunmur: Ollama-nı internetə açmaq lazım deyil,
    # ona yalnız basketiq daxili şəbəkədən müraciət edir. Dərc etsək,
    # autentifikasiyasız LLM serveri internetdə qalardı.
    volumes:
      - ollama_models:/root/.ollama

  # n8n avtomatlaşdırması - yalnız `--profile n8n` ilə qalxır.
  # Niyə profil? Hər deployment-də lazım deyil; scraping cron ilə də işlədilə bilər.
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    profiles: ["n8n"]
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Baku
      # Konteynerlər arasında ünvan servis adıdır - host.docker.internal
      # yalnız Docker Desktop-da işləyir, Linux serverdə YOX.
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - basketiq

volumes:
  # AD SABİTDİR. Olmasa compose onu qovluq adı ilə prefiksləyir
  # (`basketiq_basketiq_data`) və deploy/README.md-dəki ehtiyat nüsxə əmri
  # (`-v basketiq_data:/data`) mövcud olmayan, yəni BOŞ yeni volume-u
  # arxivləyərdi - səssizcə, xətasız.
  basketiq_data:
    name: basketiq_data
  ollama_models:
  n8n_data:
