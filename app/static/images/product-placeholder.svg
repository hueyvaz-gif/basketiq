<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img"
     aria-label="Məhsulun şəkli yoxdur">
  <title>Məhsulun şəkli yoxdur</title>
  <!--
    Şəkli olmayan məhsul üçün NEYTRAL nişan.

    Niyə paket ikonu? Uydurma məhsul fotosu qoymaq olmaz: istifadəçi onu
    həmin məhsul sayardı. Boş ağ kvadrat isə «səhifə sındı» kimi görünür.
    Neytral ikon üçüncü yoldur: yeri doldurur, heç nə iddia etmir.

    DİQQƏT: bu şərhdə İKİ TİRE İŞLƏNMİR. XML şərhi iki tire ardıcıllığını
    qəbul etmir; ilk variantda CSS token adları (iki tire ilə başlayan)
    şərhə yazılmışdı və fayl PARSE OLUNMURDU. Brauzerdə nəticə "qırıq
    şəkil" nişanı idi, konsolda isə heç bir səhv görünmürdü.

    Rənglər style.css-dəki token dəyərlərindən götürülüb (surface #f1f3f4,
    text-3 #7d7d7d). SVG ayrıca fayl olduğu üçün CSS dəyişənləri buraya
    çatmır; token dəyişsə, bu iki rəqəm də yenilənməlidir.
  -->
  <rect width="160" height="160" fill="#f1f3f4"/>
  <g fill="none" stroke="#7d7d7d" stroke-width="4"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M112 60v40a8 8 0 0 1-4.2 7l-24 13a8 8 0 0 1-7.6 0l-24-13a8 8 0 0 1-4.2-7V60"/>
    <path d="M48 56 80 39l32 17-32 17-32-17Z"/>
    <path d="M80 73v47"/>
  </g>
</svg>
