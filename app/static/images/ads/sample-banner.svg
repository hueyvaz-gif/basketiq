<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img"
     aria-label="Nümunə reklam bannerı">
  <title>Nümunə reklam bannerı</title>
  <!--
    NÜMUNƏ kreativ (E24). Real reklam materialı DEYİL və olduğunu gizlətmir:
    üzərində «NÜMUNƏ» yazır.

    Niyə uydurma market şəkli yox? Saxta kreativ real sifariş kimi görünərdi -
    həm reklamverəni, həm istifadəçini yanıldar. Neytral lövhə yeri göstərir,
    heç nə iddia etmir.

    Rənglər style.css tokenlerinin dəyərləridir (bg-subtle #f5f5f7,
    hairline #d2d2d7, text-secondary #6e6e73). SVG ayrı fayl olduğu üçün CSS
    dəyişənləri buraya çatmır; token dəyişsə, bu rəqəmlər də yenilənməlidir.
  -->
  <rect width="960" height="240" fill="#f5f5f7"/>
  <rect x="1" y="1" width="958" height="238" fill="none" stroke="#d2d2d7" stroke-width="2"/>
  <text x="480" y="112" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif"
        font-size="34" font-weight="600" fill="#1d1d1f">Araz Market</text>
  <text x="480" y="152" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif"
        font-size="20" fill="#6e6e73">həftənin endirimləri</text>
  <text x="480" y="196" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif"
        font-size="14" letter-spacing="2" fill="#86868b">NÜMUNƏ</text>
</svg>
