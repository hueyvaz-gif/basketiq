<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 150" role="img"
     aria-label="Nümunə reklam bannerı">
  <title>Nümunə reklam bannerı</title>
  <!--
    NÜMUNƏ kreativ (E24). Real reklam materialı DEYİL və olduğunu gizlətmir:
    üzərində «NÜMUNƏ» yazır.

    ÖLÇÜ BRAUZERDƏ ÖLÇÜLDÜ. İlk variant 960x240 idi və kart qutusunda
    (220x96) mətn ~8px-ə düşürdü - yəni oxunmurdu. İndi nisbət qutunun
    özünə yaxındır, mətn isə şəklin hündürlüyünün ~20%-idir.

    Niyə uydurma market şəkli yox? Saxta kreativ real sifariş kimi görünərdi -
    həm reklamverəni, həm istifadəçini yanıldar. Neytral lövhə yeri göstərir,
    heç nə iddia etmir.

    Rənglər style.css tokenlerinin dəyərləridir (bg-subtle #f5f5f7,
    hairline #d2d2d7, text #1d1d1f, text-secondary #6e6e73). SVG ayrı fayl
    olduğu üçün CSS dəyişənləri buraya çatmır; token dəyişsə, bu rəqəmlər də
    yenilənməlidir.
  -->
  <rect width="440" height="150" fill="#f5f5f7"/>
  <rect x="1" y="1" width="438" height="148" fill="none" stroke="#d2d2d7" stroke-width="2"/>
  <text x="220" y="62" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif"
        font-size="30" font-weight="600" fill="#1d1d1f">Araz Market</text>
  <text x="220" y="92" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif"
        font-size="18" fill="#6e6e73">həftənin endirimləri</text>
  <text x="220" y="124" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif"
        font-size="13" letter-spacing="3" fill="#86868b">NÜMUNƏ</text>
</svg>
