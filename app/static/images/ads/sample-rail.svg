<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 600" role="img"
     aria-label="Nümunə şaquli reklam lövhəsi">
  <title>Nümunə şaquli reklam lövhəsi</title>
  <!--
    NÜMUNƏ kreativ — yan lövhə (`home-rail-left` / `home-rail-right`).

    REAL REKLAM MATERİALI DEYİL və olduğunu gizlətmir: üzərində «NÜMUNƏ»
    yazır. Başqa saytın bannerini köçürmürük - bu, həm müəllif hüququ
    məsələsidir, həm də saxta kreativ real sifariş kimi görünüb reklamverəni
    də, istifadəçini də yanıldardı. Neytral lövhə yalnız YERİ göstərir.

    ÖLÇÜ 160x600 — şaquli bannerin standart ölçüsü («wide skyscraper»).
    Reklamverən öz materialını bu nisbətdə hazırlayır.

    Rənglər `style.css` tokenlərinin dəyərləridir (bg-subtle #f5f5f7,
    hairline #d2d2d7, text #1d1d1f, text-secondary #6e6e73, accent #0071e3).
    SVG ayrı fayl olduğu üçün CSS dəyişənləri buraya çatmır; token dəyişsə,
    bu rəqəmlər də yenilənməlidir.
  -->
  <rect width="160" height="600" rx="12" fill="#f5f5f7"/>
  <rect x="0.5" y="0.5" width="159" height="599" rx="11.5" fill="none"
        stroke="#d2d2d7" stroke-dasharray="6 5"/>

  <!-- «NÜMUNƏ» nişanı: kreativin real olmadığını elə şəklin özü deyir. -->
  <g transform="translate(80 56)">
    <rect x="-40" y="-13" width="80" height="26" rx="13" fill="#1d1d1f"/>
    <text x="0" y="5" text-anchor="middle" fill="#ffffff"
          font-family="system-ui, -apple-system, Segoe UI, sans-serif"
          font-size="12" font-weight="600" letter-spacing="1.2">NÜMUNƏ</text>
  </g>

  <!-- Ölçü göstəricisi: reklamverən materialını hansı nisbətdə hazırlamalıdır. -->
  <g transform="translate(80 300)" text-anchor="middle"
     font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text y="-52" fill="#1d1d1f" font-size="17" font-weight="600">Reklam</text>
    <text y="-28" fill="#1d1d1f" font-size="17" font-weight="600">yeri</text>
    <text y="6" fill="#0071e3" font-size="15" font-weight="600">160 × 600</text>
    <text y="34" fill="#6e6e73" font-size="12">şaquli lövhə</text>
  </g>

  <!-- Nazik ayırıcı + alt yazı: lövhənin satılıq olduğunu bildirir. -->
  <line x1="34" y1="360" x2="126" y2="360" stroke="#d2d2d7"/>
  <g transform="translate(80 392)" text-anchor="middle"
     font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text y="0" fill="#6e6e73" font-size="12">Sizin reklamınız</text>
    <text y="18" fill="#6e6e73" font-size="12">burada ola bilər</text>
  </g>
</svg>
